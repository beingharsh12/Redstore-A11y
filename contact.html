<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | RedStore</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        background: linear-gradient(45deg, blue, #fff);
      }

      nav {
        background-color: #fff;
      }

      .contact-form {
        max-width: 600px;
        margin: 4rem auto;
        padding: 2rem;
        background-color: #fff;
        box-shadow: 0 0 10px #ccc;
        border-radius: 8px;
        font-family: Arial, sans-serif;
      }

      .contact-form h1 {
        margin-bottom: 1rem;
        font-size: 2rem;
        color: #333;
      }

      .contact-form label {
        display: block;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        font-weight: bold;
      }

      .contact-form input,
      .contact-form textarea {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: Arial, sans-serif;
      }

      .contact-form textarea {
        resize: vertical;
        height: 150px;
      }

      .contact-form button {
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <nav aria-label="Primary navigation">
        <a class="logo" href="index.html" aria-label="RedStore home">RedStore</a>
        <ul class="navLinks" id="primary-navigation">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="index.html#product-section">Products</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
          <li><a href="cart.html">Cart</a></li>
        </ul>
        <button
          class="menu-icon"
          type="button"
          aria-controls="primary-navigation"
          aria-expanded="false"
          aria-label="Open navigation menu"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
      </nav>
    </header>

    <main id="main-content">
      <section class="contact-form" aria-labelledby="contact-heading">
        <h1 id="contact-heading">Contact Us</h1>
        <form action="#" >
          <p id="contact-help">All fields are required.</p>

          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required aria-required="true" />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required aria-required="true" />

          <label for="message">Message</label>
          <textarea id="message" name="message" required aria-required="true"></textarea>

          <button type="submit" class="btn">Send Message</button>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
